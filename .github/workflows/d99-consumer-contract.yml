name: D99 consumer contract
on:
  pull_request:
    branches: [sprint-sprint-9.2]
    paths:
      - 'src/contracts/cursinho-prefill/**'
      - '.github/workflows/d99-consumer-contract.yml'
permissions:
  contents: read
jobs:
  consumer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run src/contracts/cursinho-prefill/receipt.test.ts
      - run: pnpm exec tsc --noEmit
